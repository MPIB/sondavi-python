[project]
name = "sondavi"
version = "0.2.1"
description = "Read your own study data from the Sondavi survey platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Max Planck Institute for Human Development", email = "arc-support@mpib-berlin.mpg.de" },
]
# Standard library only. `urllib3` was declared here and never used - an unused
# dependency is one more thing an analysis environment has to install, and one more
# thing that can break. pandas stays optional and is needed by frame() alone.
dependencies = []

[project.urls]
Homepage = "https://github.com/MPIB/sondavi-python"
Issues = "https://github.com/MPIB/sondavi-python/issues"

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
